<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1220">
  <title>Page Not Found | Edmarjay Web Development</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#fff;text-align:center;padding:24px}
    .error-wrap{max-width:560px}.error-code{font-size:clamp(80px,18vw,150px);font-weight:800;letter-spacing:-10px;line-height:1;color:#60a5fa;margin:0}
    h1{font-size:32px;letter-spacing:-1px;margin:18px 0 10px}.error-wrap p{color:#aab8cc;margin:0 0 28px}
  </style>
</head>
<body>
  <main class="error-wrap">
    <p class="error-code">404</p>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for may have moved or no longer exists.</p>
    <a class="button button-primary" href="./">Back to the homepage ↗</a>
  </main>
</body>
</html>
